<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Percurso Contemplativo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Marcellus&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: uma nave escura, iluminada a ouro de ícone; cada estação é uma capela numa coluna estreita, com a prática ao centro como um altar. Um só tema, noturno, por escolha. */
:root{
  color-scheme:dark;
  --nave:#101216;
  --pedra:#181b21;
  --pedra-2:#232731;
  --osso:#ebe5d8;
  --osso-2:#aaa395;
  --ouro:#cfa75e;
  --ouro-2:#8c7243;
  --lapis:#2d4a7c;
  --vinho:#7b2335;
  --linha:rgba(235,229,216,.13);
  --f-titulo:'Marcellus','Trajan Pro',Georgia,serif;
  --f-corpo:'Spectral',Georgia,'Times New Roman',serif;
  --f-mao:'Caveat','Segoe Print','Bradley Hand',cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--nave)}
body{
  background:radial-gradient(110% 70% at 50% -10%,#1b2030 0%,var(--nave) 60%) fixed,var(--nave);
  color:var(--osso);font-family:var(--f-corpo);font-size:18px;line-height:1.65;font-weight:300;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nave)}
body.com-veu{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
a{color:var(--ouro)}

/* barra */
.barra{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  background:rgba(16,18,22,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linha);
}
.barra-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.marca{font-family:var(--f-titulo);letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--osso);text-decoration:none;white-space:nowrap}
.onde{font-family:var(--f-titulo);font-size:.78rem;color:var(--ouro);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.barra .esp{flex:1}
.mini{background:none;border:1px solid var(--linha);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--osso-2);cursor:pointer;font-family:var(--f-corpo)}
.mini:hover{color:var(--osso);border-color:var(--ouro-2)}
.intencao-linha{max-width:680px;margin:0 auto;padding-top:6px;font-size:.84rem;font-style:italic;color:var(--osso-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intencao-linha b{font-style:normal;font-weight:400;color:var(--ouro);font-family:var(--f-titulo);letter-spacing:.12em;font-size:.68rem;text-transform:uppercase;margin-right:6px}

main{max-width:680px;margin:0 auto;padding-block:40px 96px}

/* tipografia */
.num{font-family:var(--f-titulo);color:var(--ouro);letter-spacing:.24em;text-transform:uppercase;font-size:.8rem;margin:0 0 10px}
h1{font-family:var(--f-titulo);font-weight:400;font-size:clamp(2rem,6.4vw,3.2rem);line-height:1.08;margin:0 0 22px;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-titulo);font-weight:400;font-size:1.35rem;margin:0 0 12px;letter-spacing:.03em}
.intro,.lead{color:var(--osso);font-size:1.08rem;max-width:62ch;margin:0 0 28px}
.lbl{display:block;font-family:var(--f-titulo);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ouro);margin-bottom:8px}
.nota{font-size:.88rem;color:var(--osso-2);margin:14px 0 0;max-width:60ch}
.guia{text-align:center;margin:16px auto 0;font-style:italic;font-size:1.06rem;min-height:1.6em;max-width:44ch;transition:opacity .9s}
.guia.suave{color:var(--osso-2)}

/* estação */
.estacao{display:flex;flex-direction:column;gap:0}
.placa{display:inline-grid;gap:2px;border:1px solid var(--ouro-2);padding:12px 18px;margin:0 0 30px;align-self:flex-start;background:rgba(207,167,94,.04)}
.placa .lbl{margin:0}
.placa .obra{font-family:var(--f-titulo);font-size:1.05rem;letter-spacing:.02em}
.placa .autora{font-size:.8rem;color:var(--osso-2);font-style:italic}
.memoria{margin:0 0 36px;padding:0}
.memoria p{margin:0;font-style:italic;font-size:clamp(1.2rem,3.4vw,1.45rem);line-height:1.45;max-width:40ch;text-wrap:balance}
.pratica{background:var(--pedra);border:1px solid var(--linha);border-radius:3px;overflow:hidden}
.pr-cab{padding:22px 22px 0}
.pr-cab p{margin:0;max-width:60ch}
.pr-corpo{padding:22px;position:relative}
.vivida{display:none;align-items:center;gap:8px;font-size:.85rem;color:var(--ouro);padding:0 22px 18px}
.vivida::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ouro)}
.pratica.feita .vivida{display:flex}
.passos{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:40px;flex-wrap:wrap}

.btn{background:var(--ouro);color:#17130c;border:none;border-radius:999px;padding:12px 24px;font-family:var(--f-titulo);letter-spacing:.06em;font-size:.95rem;cursor:pointer;transition:background .3s,transform .2s}
.btn:hover{background:#dcb874}
.btn:active{transform:scale(.98)}
.btn.fantasma{background:transparent;color:var(--osso);border:1px solid var(--ouro-2)}
.btn.fantasma:hover{border-color:var(--ouro);background:rgba(207,167,94,.08)}
.ligeiro{background:none;border:none;color:var(--osso-2);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:.92rem;padding:8px 4px}
.ligeiro:hover{color:var(--osso)}
.acoes{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:20px}

input[type=text],input:not([type]),textarea{width:100%;background:var(--nave);border:1px solid var(--linha);border-radius:3px;padding:12px 14px;font-weight:300;font-size:1rem}
input:focus,textarea:focus{border-color:var(--ouro-2);outline:none}
textarea{resize:vertical}
.dizer{margin-top:20px}
.linha-form{display:flex;gap:10px;flex-wrap:wrap}
.linha-form input{flex:1 1 200px;min-width:0}

/* véus (ecrã inteiro) */
.veu{position:fixed;inset:0;z-index:60;background:#000;opacity:0;transition:opacity 1.4s ease;display:flex;align-items:center;justify-content:center;overflow:hidden}
.veu.aberto{opacity:1}
.veu canvas{position:absolute;inset:0;width:100%;height:100%}
.veu .sair{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:none;border:1px solid rgba(235,229,216,.25);color:rgba(235,229,216,.6);border-radius:999px;padding:8px 20px;font-family:var(--f-titulo);letter-spacing:.1em;font-size:.8rem;cursor:pointer;z-index:3}
.veu .sair:hover{color:#ebe5d8;border-color:rgba(235,229,216,.6)}
.sussurro{position:absolute;left:0;right:0;bottom:22%;text-align:center;padding-inline:24px;font-style:italic;font-size:clamp(1.1rem,3.6vw,1.5rem);color:rgba(235,229,216,.85);opacity:0;transition:opacity 1.2s ease;z-index:2;margin:0}
.sussurro.vis{opacity:1}
.veu.mapa{background:rgba(12,14,17,.97);display:block;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.veu.mapa .mapa-in{max-width:680px;margin:0 auto;padding-block:calc(40px + env(safe-area-inset-top,0px)) 120px}
.veu.mapa .sair{position:fixed}

/* mapa: a descida e o regresso */
.mapa-svg{width:100%;height:auto;display:block;overflow:visible}
.mapa-svg .curva{fill:none;stroke:var(--ouro-2);stroke-width:1.2;stroke-dasharray:3 5}
.mapa-svg .pt circle{fill:var(--nave);stroke:var(--ouro);stroke-width:1.5;transition:fill .4s}
.mapa-svg .pt.feita circle{fill:var(--ouro)}
.mapa-svg .pt.atual circle{stroke-width:3;fill:var(--pedra-2)}
.mapa-svg .pt text{fill:var(--osso);font-family:var(--f-titulo);font-size:16px;text-anchor:middle}
.mapa-svg .pt{cursor:pointer}
.mapa-svg .pt:hover circle{fill:var(--ouro-2)}
.mapa-svg .marco{fill:var(--osso-2);font-family:var(--f-corpo);font-style:italic;font-size:15px;text-anchor:middle}
.lista{list-style:none;padding:0;margin:24px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 24px}
.lista a{display:grid;grid-template-columns:44px 1fr;align-items:baseline;gap:8px;text-decoration:none;color:var(--osso);padding:8px 0;border-bottom:1px solid var(--linha)}
.lista a:hover{color:var(--ouro)}
.lista .r{font-family:var(--f-titulo);color:var(--ouro);font-size:.85rem;letter-spacing:.06em}
.lista .t{font-size:.95rem}
.lista .f{color:var(--ouro);font-size:.75rem;margin-left:6px}

/* início */
.inicio .titulo{font-size:clamp(2.8rem,11vw,5.4rem);line-height:.98;margin-bottom:26px;letter-spacing:.02em}
.inicio .titulo span{color:var(--ouro)}
.intencao{background:var(--pedra);border:1px solid var(--linha);padding:24px;margin:36px 0 12px;border-radius:3px}
.intencao .nota{margin:0 0 14px}
.sugestoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:none;border:1px solid var(--linha);border-radius:999px;padding:5px 14px;font-size:.88rem;cursor:pointer;color:var(--osso-2)}
.chip:hover{border-color:var(--ouro-2);color:var(--osso)}
.intencao .acoes{justify-content:flex-start}
.int-wrap{position:relative}
.int-ph{position:absolute;left:15px;right:15px;top:13px;color:var(--osso-2);font-weight:300;pointer-events:none;line-height:1.5}
.int-ph em{font-style:italic}
.sobre{margin-top:40px;display:grid;gap:14px}
.sobre p{margin:0;max-width:62ch;color:var(--osso-2)}

/* I · sino */
.chao{width:min(250px,64vw);aspect-ratio:1;max-width:100%;margin:10px auto 0;border-radius:50%;border:2px solid #f2eee6;display:grid;place-items:center;box-shadow:0 0 40px rgba(242,238,230,.08) inset}
.sopro{width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(207,167,94,.55),rgba(207,167,94,.08) 70%,transparent);transition:transform 4s ease-in-out}
.sino-wrap{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:24px}
.sino{background:none;border:none;cursor:pointer;width:118px;padding:0;transform-origin:50% 8%;position:relative;z-index:2}
.sino svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(207,167,94,.25))}
.sino.tocou{animation:balanca 5s ease-out}
.sino[aria-disabled=true]{cursor:default}
@keyframes balanca{0%{transform:rotate(0)}8%{transform:rotate(14deg)}20%{transform:rotate(-10deg)}34%{transform:rotate(7deg)}50%{transform:rotate(-4deg)}68%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.ondas{position:absolute;left:50%;top:84px;width:0;height:0}
.onda{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:1px solid var(--ouro);opacity:0;animation:onda 7s ease-out forwards}
@keyframes onda{0%{transform:scale(.4);opacity:.7}100%{transform:scale(6);opacity:0}}

/* II · confessionário */
.lados{list-style:none;display:flex;gap:4px;padding:0;margin:0 0 20px;justify-content:center;flex-wrap:wrap}
.lados li{font-family:var(--f-titulo);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--osso-2);padding:4px 12px;border-bottom:1px solid transparent}
.lados li.on{color:var(--ouro);border-bottom-color:var(--ouro)}
.ranhura{width:62%;height:9px;margin:4px auto 18px;border-radius:5px;background:#050506;box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06)}
.papel{background:#ece4d1 repeating-linear-gradient(transparent 0 33px,rgba(60,80,120,.18) 33px 34px)!important;color:#2a231a!important;font-family:var(--f-mao)!important;font-size:1.45rem!important;line-height:34px!important;border:none!important;padding:6px 16px!important;border-radius:2px!important;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform 1.5s cubic-bezier(.6,0,.3,1),opacity 1.5s ease;transform-origin:50% 0}
.papel.cor{background:#e3c88b repeating-linear-gradient(transparent 0 33px,rgba(120,70,20,.18) 33px 34px)!important}
.papel::placeholder{color:rgba(42,35,26,.45)}
.dobrar{transform:perspective(700px) rotateX(78deg) scaleY(.25) translateY(-160%)!important;opacity:0!important}
.bilhete{background:#ece4d1;color:#2a231a;font-family:var(--f-mao);font-size:1.5rem;line-height:1.35;padding:18px 20px;margin:16px auto 20px;max-width:440px;transform:rotate(-1.2deg);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.bilhete.cor{background:#e3c88b;transform:rotate(1deg)}
.a-chegar{opacity:.55;animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.25}}
.desdobrar{animation:desdobra 1.6s cubic-bezier(.2,.7,.3,1)}
@keyframes desdobra{from{transform:perspective(700px) rotateX(-80deg) translateY(-30px);opacity:0}to{transform:rotate(1deg);opacity:1}}

/* III · caixa escura */
.caixa-pre{aspect-ratio:16/9;max-width:100%;background:#070402;border-radius:2px;position:relative;box-shadow:inset 0 0 60px rgba(0,0,0,.9)}
.caixa-pre{overflow:hidden}
.caixa-pre::before{content:"";position:absolute;left:50%;top:16%;width:160%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,218,150,.26),rgba(250,190,115,.09) 25%,rgba(220,145,80,.03) 55%,transparent 75%);pointer-events:none}
.caixa-pre .furo{position:absolute;left:50%;top:16%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:#fff6e2;box-shadow:0 0 16px 5px rgba(255,236,200,.5)}

/* IV · círculo */
.parede-pre{aspect-ratio:16/9;max-width:100%;background:#2c2b29;border-radius:2px;display:grid;place-items:center}
.circ-pre{width:22%;aspect-ratio:1;border-radius:50%;background:#f3f0e8}
.veu.parede{background:#2c2b29}
.circulo-branco{width:min(44vmin,320px);aspect-ratio:1;border-radius:50%;background:#f4f1ea;transition:opacity 1.6s ease;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.veu.parede .sussurro{color:rgba(235,229,216,.7);bottom:14%}

/* V · feijões e arroz */
.mesa{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:4px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#6a4a32,#46301f 70%);box-shadow:inset 0 0 50px rgba(0,0,0,.5)}
.mesa::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(92deg,transparent 0 14px,rgba(0,0,0,.05) 14px 15px);pointer-events:none}
.taca{position:absolute;left:66%;top:33%;width:28%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 45% 40%,#e4ded2,#b9b1a3 60%,#8f877a);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 -6px 14px rgba(0,0,0,.25)}
.arroz{position:absolute;width:9px;height:4px;border-radius:50%;background:#f2ecdf;box-shadow:0 1px 1px rgba(0,0,0,.3)}
.feijao{position:absolute;width:19px;height:12px;padding:0;border:none;border-radius:50% 50% 46% 46% / 60% 60% 40% 40%;cursor:pointer;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35),inset 2px 2px 3px rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.4);transition:left 1.2s cubic-bezier(.5,0,.2,1),top 1.2s cubic-bezier(.5,0,.2,1),transform 1.2s ease;z-index:2}
.feijao::before{content:"";position:absolute;inset:-10px}
.feijao:hover{filter:brightness(1.3)}
.feijao.na-taca{cursor:default;z-index:3}

/* VI · espelho */
.espelho{position:relative;width:min(320px,100%);aspect-ratio:3/4;margin:0 auto;border-radius:160px 160px 6px 6px;overflow:hidden;border:7px solid #6f5c3c;box-shadow:0 0 0 1px #a88a55,0 18px 40px rgba(0,0,0,.5)}
.reflexo{position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,#424a55,#191d23 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
.eusou{font-family:var(--f-titulo);font-size:2.4rem;color:var(--osso);letter-spacing:.04em;margin-top:-30%}
.linhas{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-mao);font-size:1.4rem;color:#f0e2bf;text-align:center}
.linhas span{animation:aparece 2s ease}
@keyframes aparece{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.espelho canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

/* VII · água */
.agua{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:50% / 22%;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(200,230,250,.15),0 14px 30px rgba(0,0,0,.4)}
.agua canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.letras{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none;font-family:var(--f-mao);font-size:2rem;color:#eaf4fb;padding-inline:20px}
.letras span{display:inline-block;animation:afunda 6s ease-in forwards}
@keyframes afunda{0%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(70px) scale(.7);filter:blur(8px)}}
.lavar{display:flex;flex-direction:column;align-items:center;margin-top:24px}
.figura{height:300px;width:auto;max-width:100%;color:var(--osso);touch-action:none;cursor:ns-resize;margin-top:12px}

/* VIII · deserto */
.deserto{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:3px;overflow:hidden}
.deserto canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pedra{position:absolute;width:13%;aspect-ratio:1.35;border:none;border-radius:48% 52% 45% 55% / 55% 50% 50% 45%;background:radial-gradient(circle at 35% 30%,#a19a90,#6c665e 60%,#4d4842);box-shadow:4px 8px 10px rgba(60,40,15,.45);cursor:pointer;transition:box-shadow .8s,filter .8s;padding:0}
.pedra:nth-of-type(2){transform:rotate(-14deg) scale(.86)}
.pedra:nth-of-type(3){transform:rotate(8deg) scale(1.1)}
.pedra.acesa{box-shadow:4px 8px 10px rgba(60,40,15,.45),0 0 26px 6px rgba(255,226,160,.55);filter:brightness(1.15)}
.escrito{text-align:center;font-style:italic;margin:18px auto 0;max-width:46ch;min-height:3.2em;transition:opacity .8s}

/* IX · Caná */
.texto-cana{font-size:1.12rem;line-height:1.9;max-width:60ch}
.pal{cursor:pointer;border-radius:2px;transition:background .3s,color .3s;padding:0 1px}
.pal:hover{background:rgba(207,167,94,.18)}
.pal.escolhida{background:var(--ouro);color:#17130c}
.escrever{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;align-items:start;margin-top:26px}
@media (max-width:560px){.escrever{grid-template-columns:minmax(0,1fr)}.talha{max-width:240px;margin:0 auto}}
.talha svg{width:100%;height:auto;display:block}
#vinho{transition:fill 1.2s ease}
.peca{fill:#efe9dc;stroke:rgba(0,0,0,.18);stroke-width:.6;transform-box:fill-box;transform-origin:center;animation:pousa .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes pousa{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.escrever .dizer{margin-top:0}
.folha{margin-top:16px;background:#ece4d1;color:#3a2e20;font-family:var(--f-mao);font-size:1.3rem;line-height:1.35;padding:14px 16px;min-height:120px;max-height:260px;overflow:auto;border-radius:2px;word-break:break-word}
.folha span{display:inline-block;margin:0 6px 0 0;animation:aparece 1s ease}

/* X · esferas */
.monte{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;border-radius:3px;transition:background 3s ease,color 3s ease}
.clarao{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 42%,rgba(255,246,222,.75),rgba(255,236,190,.12) 45%,transparent 70%);opacity:0;transition:opacity 2.4s ease;pointer-events:none}
.contas{width:min(300px,86%);height:auto;color:var(--osso);position:relative}
.esfera{transform-box:fill-box;transform-origin:center;transition:transform 4s ease-out,filter 2s}
.esfera.inspira{transform:scale(1.4);filter:drop-shadow(0 0 8px rgba(255,236,190,.9))}
.esfera.passada{filter:brightness(1.35)}
.monte.transfigurado{background:#f6efdd;color:#2a2218}
.monte.transfigurado .guia{color:#2a2218}
.monte .guia{position:relative}
.respirar{user-select:none;-webkit-user-select:none;touch-action:none;min-width:260px}
.respirar.premido{background:#f0dba8;box-shadow:0 0 30px rgba(240,219,168,.45)}

/* XI · banquete */
.banquete{width:100%;height:auto;display:block}
.banquete .elem{cursor:pointer;outline:none}
.banquete .elem:focus-visible .aura,.banquete .elem.olhado .aura{opacity:1}
.aura{opacity:0;transition:opacity 1.4s ease}
.metade{transition:transform 1.6s cubic-bezier(.3,0,.2,1);transform-box:fill-box}
.partido .metade.e{transform:translate(-16px,2px) rotate(-8deg)}
.partido .metade.d{transform:translate(16px,2px) rotate(8deg)}
.migalhas{opacity:0;transition:opacity 1.2s .6s}
.partido .migalhas{opacity:1}
.liquido{transition:y 2.4s ease,height 2.4s ease}
.gestos{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:48px;margin-top:6px}

/* XII · cinza */
.cinza{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:2px;overflow:hidden;background:linear-gradient(160deg,#1d1a17,#0f0d0b);box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 0 6px #2a241d}
.cinza canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* XIII · trigo */
.campo{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:center;margin-top:22px}
@media (max-width:520px){.campo{grid-template-columns:minmax(0,1fr)}}
.trigo-taca{aspect-ratio:1;max-width:190px;width:100%;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 45% 40%,#3c3a36,#24221f 70%);box-shadow:inset 0 8px 18px rgba(0,0,0,.6),0 0 0 3px #4a4540;position:relative}
.grao{position:absolute;width:13px;height:7px;border-radius:50%;border:none;padding:0;background:linear-gradient(160deg,#e9c27a,#b4823d);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25);cursor:pointer}
.grao::before{content:"";position:absolute;inset:-9px}
.grao:disabled{cursor:default}
.grao.voa{position:absolute;z-index:5;transition:left 1.6s cubic-bezier(.4,0,.3,1),top 1.6s cubic-bezier(.5,-.3,.6,1),transform 1.6s,opacity .8s}
.terra{aspect-ratio:3/2;max-width:100%;border-radius:3px;position:relative;background:
  radial-gradient(circle at 20% 30%,rgba(0,0,0,.25) 0 2px,transparent 3px) 0 0/23px 19px,
  radial-gradient(circle at 70% 60%,rgba(150,110,70,.25) 0 1.5px,transparent 2.5px) 0 0/17px 21px,
  linear-gradient(170deg,#4a3324,#2e1f15);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 0 6px #5a4630}
.monticulo{position:absolute;width:44px;height:14px;margin-left:-22px;margin-top:-7px;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 30%,#6a4a32,#3a281b);opacity:0;transform:scaleY(.2);transition:opacity 1.4s,transform 1.4s}
.monticulo.on{opacity:1;transform:none}

/* XIV · lousa */
.lousa{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:3px;overflow:hidden;box-shadow:0 0 0 6px #3a352e,0 16px 30px rgba(0,0,0,.45)}
.lousa canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.reflexao{display:grid;gap:10px;margin-top:28px}
.reflexao .lbl{margin:10px 0 0}



/* II · parede das respostas */
.parede-notas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:18px 14px;margin:4px 0 8px;border-radius:3px;background:#3a3229 radial-gradient(circle at 30% 20%,rgba(255,255,255,.05),transparent 60%);box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.nota-p{background:#efe5c6;color:#2a231a;font-family:var(--f-mao);font-size:1.15rem;line-height:1.25;padding:8px 12px;max-width:46%;transform:rotate(var(--r));box-shadow:0 5px 12px rgba(0,0,0,.4);word-break:break-word}
.nota-p.tua{background:#e3c88b;animation:colar 1.4s cubic-bezier(.2,.8,.3,1)}
@keyframes colar{from{opacity:0;transform:translateY(-40px) scale(1.25) rotate(4deg)}to{opacity:1;transform:rotate(var(--r))}}

/* III · rosto */
.rosto-folha{position:relative;width:min(360px,100%);aspect-ratio:3/4;margin:0 auto;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--ouro-2),0 16px 34px rgba(0,0,0,.5)}
.rosto-folha canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.rosto-veu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:rgba(10,7,4,.84);transition:opacity 1.2s ease;z-index:2}
.rosto-veu.fora{opacity:0;pointer-events:none}
.rosto-veu .guia{margin:0;transition:opacity .6s}
#g3{transition:opacity .5s}

/* V · arroz e trigo */
.trigo-g{width:11px;height:6px;background:linear-gradient(160deg,#ecc77f,#a8742f)!important;box-shadow:inset -1px -1px 1px rgba(0,0,0,.3),0 1px 1px rgba(0,0,0,.35)}
.arroz-g{width:10px;height:4.5px;border-radius:50%!important;background:#f4eee2!important;box-shadow:0 1px 1px rgba(0,0,0,.35)!important}
.trigo-s{position:absolute;width:11px;height:6px;border-radius:50%;background:linear-gradient(160deg,#ecc77f,#a8742f);box-shadow:inset -1px -1px 1px rgba(0,0,0,.3),0 1px 1px rgba(0,0,0,.35)}
.trigo-s::after{content:"";position:absolute;left:18%;right:18%;top:48%;height:1px;background:rgba(95,58,20,.55)}
.taca.escura{background:radial-gradient(circle at 45% 40%,#5d4c3d,#3b2f25 60%,#261d16)}
.trigo-g::after{content:"";position:absolute;left:18%;right:18%;top:48%;height:1px;background:rgba(95,58,20,.55)}
.pergunta{text-align:center;font-family:var(--f-titulo);color:var(--ouro);letter-spacing:.04em;font-size:1.15rem;min-height:1.6em;margin:4px 0 0;transition:opacity .8s}
.discernir{display:grid;gap:8px;margin-top:22px;animation:aparece 1.4s ease}
.discernir .lbl{margin:8px 0 0}

/* VI · puzzle */
.puzzle{position:relative;margin:6px auto 0;max-width:100%;transition:height 1.2s ease}
.ranhura-pz{position:absolute;box-sizing:border-box;border:1px dashed rgba(235,229,216,.18);background:rgba(255,255,255,.02)}
.peca-pz{position:absolute;left:0;top:0;cursor:grab;touch-action:none;border-radius:2px;box-shadow:0 6px 14px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.3,.7,.3,1),box-shadow .5s}
.peca-pz.agarrada{transition:none;cursor:grabbing;box-shadow:0 14px 28px rgba(0,0,0,.6)}
.peca-pz.certa{cursor:default;border-radius:0;box-shadow:none}
.puzzle.completo{box-shadow:0 0 50px rgba(255,220,160,.35)}
.eusou-pz{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-family:var(--f-titulo);font-size:2.1rem;color:#2a1a10;text-shadow:0 0 18px rgba(255,244,214,.95);animation:aparece 2.6s ease;pointer-events:none;z-index:50}
#g6{transition:opacity .4s}

/* VIII · escultura */
.escultura-pre{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:3px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#3a2b1e,#120c08 72%)}
.escultura-pre span{position:absolute;left:50%;top:50%;width:46px;height:40px;margin:-20px 0 0 -23px;transform:rotate(calc(var(--i)*60deg)) translateY(-31%) translateY(-60px) rotate(calc(var(--i)*-60deg));opacity:.9}
.escultura-pre svg{width:100%;height:100%}
.escultura-pre b{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,180,.6),transparent 70%)}
.veu.escultura{background:radial-gradient(circle at 50% 46%,#3d2d1f,#140d08 62%,#080503)}
.roda{position:absolute;left:50%;top:46%;width:0;height:0;--R:min(34vmin,230px);animation:girar 240s linear infinite}
.elemento{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border:none;border-radius:50%;padding:0;cursor:pointer;background:radial-gradient(circle,rgba(255,230,180,.08),transparent 70%);
  transform:rotate(calc(var(--i)*60deg)) translateY(calc(-1*var(--R))) rotate(calc(var(--i)*-60deg));transition:background 1.5s,filter 1.5s}
.el-in{display:flex;flex-direction:column;align-items:center;gap:2px;animation:girar 240s linear infinite reverse}
.el-in svg{width:72px;height:63px}
.el-in small{font-family:var(--f-titulo);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(235,229,216,.55)}
.elemento:hover,.elemento:focus-visible{background:radial-gradient(circle,rgba(255,230,180,.2),transparent 70%)}
.elemento.tocado{background:radial-gradient(circle,rgba(255,226,170,.32),transparent 72%);filter:drop-shadow(0 0 12px rgba(255,220,160,.55))}
.elemento.tocado small{color:var(--ouro)}
.centro{position:absolute;left:50%;top:46%;width:90px;height:90px;margin:-45px;border-radius:50%;background:radial-gradient(circle,rgba(255,238,200,.45),rgba(255,220,160,.08) 55%,transparent 72%);animation:respira 8s ease-in-out infinite}
.veu.escultura.pleno .centro{width:240px;height:240px;margin:-120px;transition:all 4s ease}
.veu.escultura .sussurro{bottom:12%}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes respira{50%{transform:scale(1.25);opacity:.8}}

/* IX · água que se faz vinho */
.monte.cana{overflow:hidden}
.monte.cana::before,.monte.cana::after{content:"";position:absolute;inset:0;border-radius:3px;transition:opacity 3s ease;pointer-events:none}
.monte.cana::before{background:radial-gradient(circle at 50% 45%,rgba(70,120,160,.35),transparent 70%);opacity:calc(1 - var(--vinho,0))}
.monte.cana::after{background:radial-gradient(circle at 50% 45%,rgba(130,30,52,.45),transparent 72%);opacity:var(--vinho,0)}
.monte.cana .contas,.monte.cana .guia{position:relative;z-index:1}
.monte.festa::after{animation:festa 4s ease-in-out infinite}
@keyframes festa{50%{filter:brightness(1.4)}}

/* XI · velas da gratidão */
.vela{animation:aparece 1.6s ease}
.vela path{transform-box:fill-box;transform-origin:50% 100%;animation:chama 2.6s ease-in-out infinite}
@keyframes chama{50%{transform:scaleY(1.15) scaleX(.9)}}

/* XIII · citação e broto */
.citacao{margin:0 0 22px;padding-left:14px;border-left:2px solid var(--ouro-2);font-style:italic;font-size:1.15rem;max-width:52ch}
.broto{position:absolute;width:2px;height:0;margin-left:-1px;background:#7aa851;transform:translateY(-100%);transition:height 9s ease-out;border-radius:2px}
.broto.on{height:34px}
.broto::before,.broto::after{content:"";position:absolute;top:2px;width:12px;height:5px;border-radius:50%;background:#8dbb5f;transform:scale(0);transition:transform 3s ease 6s}
.broto::before{right:1px;transform-origin:100% 50%}
.broto::after{left:1px;transform-origin:0 50%;top:8px}
.broto.on::before{transform:rotate(-25deg) scale(1)}
.broto.on::after{transform:rotate(25deg) scale(1)}

.memo-img{display:block;width:100%;height:auto;border-radius:2px;margin-top:4px}

.veu.sala-mesa .sair{background:rgba(20,13,8,.88);color:#ebe5d8;border:1px solid var(--ouro);padding:11px 26px;font-size:.88rem;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.veu.sala-mesa .sair:hover{background:rgba(40,27,16,.95);color:#fff}
.veu.sala-mesa .sussurro{bottom:auto;top:calc(12% + env(safe-area-inset-top,0px));text-shadow:0 1px 14px rgba(0,0,0,.9)}
/* caixa de memórias */
.caixa-sec{margin-top:56px}
.arca{position:relative;perspective:1200px;margin-top:6px}
.tampa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:150px;border:none;cursor:pointer;border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,#5a3d27,#3e2919);box-shadow:inset 0 0 0 3px #2c1d12,inset 0 0 0 5px var(--ouro-2),0 18px 36px rgba(0,0,0,.5);
  transform-origin:50% 0;transition:transform 1.4s cubic-bezier(.5,0,.2,1),min-height 1.4s,box-shadow 1.4s;color:var(--osso)}
.tampa:hover .selo{box-shadow:0 0 22px rgba(207,167,94,.6)}
.selo{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0d394,var(--ouro) 50%,#7d5f2e);box-shadow:0 0 10px rgba(207,167,94,.3);transition:box-shadow .5s}
.tampa-txt{font-family:var(--f-titulo);letter-spacing:.16em;text-transform:uppercase;font-size:.8rem}
.arca.aberta .tampa{transform:rotateX(-14deg);min-height:64px;cursor:default;flex-direction:row}
.arca.aberta .selo{width:26px;height:26px}
.dentro{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:26px 18px 30px;margin-top:-4px;
  background:linear-gradient(180deg,#2a1c12,#1e140d);box-shadow:inset 0 14px 24px rgba(0,0,0,.6),inset 0 0 0 3px #2c1d12;border-radius:0 0 4px 4px}
.memo{background:#ece4d1;color:#2a231a;padding:14px 16px 16px;transform:rotate(var(--r));box-shadow:0 8px 18px rgba(0,0,0,.4);min-width:0;
  opacity:0;animation:sobe 1s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i) * 180ms + 400ms)}
.memo:nth-child(3n+2){background:#e3c88b}
.memo-cab{display:block;font-family:var(--f-titulo);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#6b5636;margin-bottom:6px}
.memo-cab b{font-weight:400;color:#8a6a33}
.memo p{margin:0;font-family:var(--f-mao);font-size:1.35rem;line-height:1.3;word-break:break-word}
.memo p+p{margin-top:4px}
@keyframes sobe{from{opacity:0;transform:translateY(30px) rotate(0)}to{opacity:1;transform:rotate(var(--r))}}
.vazio{grid-column:1/-1;text-align:center;font-style:italic;color:var(--osso-2);margin:10px 0}
.esperanca{margin-top:44px;animation:aparece 1.6s ease}
.esp-corpo{position:relative;padding:30px 26px;border:1px solid var(--ouro-2);background:radial-gradient(120% 100% at 50% 0%,rgba(207,167,94,.12),transparent 70%),var(--pedra)}
.esp-txt{margin:0;font-style:italic;font-size:clamp(1.12rem,3vw,1.3rem);line-height:1.6;white-space:pre-wrap;max-width:56ch}
.esp-txt:empty{display:none}
.esp-txt.a-escrever:empty::before{content:"A escutar o que escreveste…";display:block;color:var(--osso-2)}
.esp-txt.a-escrever:empty{display:block}
.esp-corpo .acoes{margin-top:0}
.esp-txt:not(:empty)+.acoes{margin-top:20px}
#levar{justify-content:flex-start}

/* fim */
.colheita{display:grid;gap:22px;margin:30px 0}
.colheita dt{font-family:var(--f-titulo);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ouro)}
.colheita dd{margin:4px 0 0;font-style:italic;font-size:1.25rem;max-width:44ch;white-space:pre-wrap}
.colheita dd.palavra{font-family:var(--f-mao);font-style:normal;font-size:2rem}

@media (max-width:480px){
  body{font-size:17px}
  .marca{font-size:.64rem;letter-spacing:.1em}
  .pr-cab{padding:18px 16px 0}.pr-corpo{padding:18px 16px}.vivida{padding:0 16px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .feijao,.grao.voa,.metade{transition-duration:.2s!important}
}
</style>

<body>
<header class="barra">
  <div class="barra-in">
    <a class="marca" href="#inicio">Percurso Contemplativo</a>
    <span class="onde" id="onde"></span>
    <span class="esp"></span>
    <button class="mini" id="btnSom" aria-pressed="true">Som</button>
    <button class="mini" id="btnMapa">Mapa</button>
  </div>
  <div class="intencao-linha" id="intLinha" hidden></div>
</header>
<main id="stage"></main>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('percurso_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('percurso_'+k,JSON.stringify(v))}catch(e){}}
};
const S={
  intencao:store.get('intencao',''),
  feitas:store.get('feitas',[]),
  palavra:store.get('palavra',''),
  sinto:store.get('sinto',''),
  renasce:store.get('renasce',''),
  som:store.get('som',true)
};
/* o que a pessoa escreve ao longo do caminho, guardado só neste dispositivo */
let D=store.get('diario',{});
function guarda(k,v,lista){v=String(v).trim();if(!v)return;if(lista){D[k]=(D[k]||[]).concat(v).slice(-8)}else D[k]=v;store.set('diario',D)}
function novoCaminho(){S.feitas=[];store.set('feitas',[]);D={};store.set('diario',D);S.palavra='';S.sinto='';S.renasce='';['palavra','sinto','renasce'].forEach(k=>store.set(k,''))}
const usar=n=>(window.claude&&typeof window.claude.use==='function')?Promise.race([window.claude.use(n).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),10000))]):Promise.resolve(null);
const downloadsP=Promise.resolve(null);
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- som ---------- */
let AC=null,master=null;
function audio(){
  if(!S.som) return null;
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);}
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){return null}
}
function sino(f=196,dur=16,vol=.5){
  const a=audio(); if(!a) return; const t=a.currentTime+.02;
  [[.5,.55,1],[1,1,.85],[1.19,.45,.6],[1.56,.32,.5],[2,.38,.45],[2.51,.22,.32],[2.66,.18,.28],[3.01,.15,.22],[4.1,.08,.15],[5.4,.05,.1]].forEach(([r,amp,dm])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=f*r;o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp*vol,t+.005);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur*dm);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur*dm+.2);
  });
}
const chime=(f=880,vol=.1,dur=3)=>sino(f,dur,vol);
function gota(){
  const a=audio(); if(!a) return; const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();o.type='sine';
  const f=rnd(500,900);o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.6,t+.07);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);
}
function toque(){
  const a=audio(); if(!a) return; const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=rnd(1100,1500);
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.08);
}

/* ---------- utilitários ---------- */
let limpezas=[];
const onCleanup=f=>limpezas.push(f);
function limpar(){const l=limpezas;limpezas=[];l.forEach(f=>{try{f()}catch(e){}})}
function loop(fn){
  let id,last=performance.now(),vivo=true;
  const f=t=>{if(!vivo)return;fn(t,Math.min(.05,(t-last)/1000));last=t;id=requestAnimationFrame(f)};
  id=requestAnimationFrame(f);
  const stop=()=>{vivo=false;cancelAnimationFrame(id)};onCleanup(stop);return stop;
}
function fitCanvas(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1),r=cv.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  return {c,w:r.width,h:r.height,dpr};
}
function offscreen(F){const b=document.createElement('canvas');b.width=F.c.canvas.width;b.height=F.c.canvas.height;return b}
function pintaBase(F,base,alpha=1){const c=F.c;c.save();c.setTransform(1,0,0,1,0,0);c.globalAlpha=alpha;c.drawImage(base,0,0);c.restore()}
function arrasta(el,{down,move,up}){
  const pos=e=>{const r=el.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  let on=false;
  el.addEventListener('pointerdown',e=>{on=true;try{el.setPointerCapture(e.pointerId)}catch(_){}down&&down(pos(e));e.preventDefault()});
  el.addEventListener('pointermove',e=>{if(on&&move)move(pos(e))});
  const fin=e=>{if(!on)return;on=false;up&&up(pos(e))};
  el.addEventListener('pointerup',fin);el.addEventListener('pointercancel',fin);
}
function overlay(cls,html,onClose,rotulo='Levantar-me'){
  const o=document.createElement('div');o.className='veu '+cls;
  o.innerHTML=html+`<button class="sair" type="button">${rotulo}</button>`;
  document.body.appendChild(o);document.body.classList.add('com-veu');
  requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('aberto')));
  let fechado=false;
  const close=()=>{if(fechado)return;fechado=true;o.classList.remove('aberto');document.body.classList.remove('com-veu');setTimeout(()=>o.remove(),1400);onClose&&onClose()};
  o.querySelector('.sair').onclick=close;
  const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  onCleanup(()=>{document.removeEventListener('keydown',k);close()});
  return {el:o,close};
}

function atual(){const m=location.hash.match(/^#e(\d+)$/);return m?+m[1]:0}
function mapaSVG(cur){
  const pts=EST.map((_,i)=>({x:34+i*(572/13),y:44+Math.sin(Math.PI*i/13)*178}));
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){const p=pts[i-1],q=pts[i],mx=(p.x+q.x)/2;d+=` C${mx} ${p.y} ${mx} ${q.y} ${q.x} ${q.y}`}
  return `<svg class="mapa-svg" viewBox="0 0 640 280" role="img" aria-label="Mapa do percurso: catorze estações que descem e voltam a subir">
    <path class="curva" d="${d}"/>
    <text class="marco" x="34" y="18">Primeiro passo</text><text class="marco" x="320" y="268">mergulho interior</text><text class="marco" x="606" y="18">Regresso</text>
    ${pts.map((p,i)=>`<g class="pt${S.feitas.includes(i+1)?' feita':''}${cur===i+1?' atual':''}" data-ir="#e${i+1}" tabindex="0" role="link" aria-label="Estação ${ROM[i]}: ${EST[i].t}"><circle cx="${p.x}" cy="${p.y}" r="9"/><text x="${p.x}" y="${p.y+(i>0&&i<13?-17:30)}">${ROM[i]}</text></g>`).join('')}
  </svg>`;
}

  return `<ol class="lista">${EST.map((e,i)=>`<li><a href="#e${i+1}" data-ir="#e${i+1}"><span class="r">${ROM[i]}</span><span class="t">${e.t}${S.feitas.includes(i+1)?'<span class="f">vivida</span>':''}</span></a></li>`).join('')}</ol>`;
}

/* luz de Natal: quente, envolvente, que desce de um ponto e chega ao chão já muito diluída */
function luzNatal(){
  const LZ=[],ON=[];let proxOnda=1200;
  return (c,w,h,t,dt)=>{
    c.globalCompositeOperation='source-over';
    c.fillStyle='#070402';c.fillRect(0,0,w,h);
    const hx=w*.5,hy=h*.1,pulse=.92+.08*Math.sin(t/3600);
    const R=Math.hypot(Math.max(hx,w-hx),h-hy)*1.08;
    c.globalCompositeOperation='lighter';
    const g=c.createRadialGradient(hx,hy,0,hx,hy,R*pulse);
    g.addColorStop(0,'rgba(255,224,160,.34)');g.addColorStop(.06,'rgba(255,212,140,.22)');g.addColorStop(.22,'rgba(250,190,115,.12)');
    g.addColorStop(.5,'rgba(235,165,95,.065)');g.addColorStop(.8,'rgba(215,140,80,.035)');g.addColorStop(1,'rgba(200,125,70,.018)');
    c.fillStyle=g;c.fillRect(0,0,w,h);
    const v=c.createRadialGradient(w/2,h*.55,Math.min(w,h)*.2,w/2,h*.55,Math.hypot(w,h)*.7);
    v.addColorStop(0,'rgba(255,200,130,0)');v.addColorStop(1,`rgba(255,190,120,${.03+.015*Math.sin(t/4100)})`);
    c.fillStyle=v;c.fillRect(0,0,w,h);
    if(t>proxOnda){ON.push({r:6,a:1});proxOnda=t+6500}
    for(let i=ON.length-1;i>=0;i--){const o=ON[i];o.r+=(14+o.r*.09)*dt;o.a=Math.max(0,o.a-.055*dt);if(o.a<=0||o.r>R*1.1){ON.splice(i,1);continue}
      const k=c.createRadialGradient(hx,hy,o.r*.45,hx,hy,o.r);k.addColorStop(0,'rgba(255,215,150,0)');k.addColorStop(.7,`rgba(255,215,150,${.06*o.a})`);k.addColorStop(1,'rgba(255,215,150,0)');
      c.fillStyle=k;c.beginPath();c.arc(hx,hy,o.r,0,7);c.fill()}
    if(Math.random()<dt*6){const a=rnd(.1,Math.PI-.1),sp=rnd(6,22);LZ.push({x:hx+rnd(-4,4),y:hy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.8+rnd(4,10),r:rnd(.7,1.6),a:rnd(.55,.95),f:rnd(.035,.07),ph:rnd(0,6)})}
    for(let i=LZ.length-1;i>=0;i--){const q=LZ[i];q.x+=(q.vx+Math.sin(t/1400+q.ph)*3)*dt;q.y+=q.vy*dt;q.vx*=1-.1*dt;q.r+=.9*dt;q.a-=q.f*dt;
      if(q.a<=0||q.y>h+20){LZ.splice(i,1);continue}
      const al=q.a*(.7+.3*Math.sin(t/300+q.ph*3));
      const s=c.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*3.5);s.addColorStop(0,`rgba(255,232,180,${al*.55})`);s.addColorStop(1,'rgba(255,220,160,0)');
      c.fillStyle=s;c.beginPath();c.arc(q.x,q.y,q.r*3.5,0,7);c.fill()}
    const r=c.createRadialGradient(hx,hy,0,hx,hy,70*pulse);r.addColorStop(0,'rgba(255,252,238,1)');r.addColorStop(.06,'rgba(255,236,196,.9)');r.addColorStop(.3,'rgba(255,214,150,.25)');r.addColorStop(1,'rgba(255,210,140,0)');
    c.fillStyle=r;c.beginPath();c.arc(hx,hy,72,0,7);c.fill();
    const br=.22+.08*Math.sin(t/900);c.lineCap='round';
    [[0,46],[Math.PI/2,30]].forEach(([ang,len])=>{for(const sg of [1,-1]){const ex=hx+Math.cos(ang)*len*sg,ey=hy+Math.sin(ang)*len*sg;const lg=c.createLinearGradient(hx,hy,ex,ey);lg.addColorStop(0,`rgba(255,240,205,${br})`);lg.addColorStop(1,'rgba(255,240,205,0)');c.strokeStyle=lg;c.lineWidth=1.4;c.beginPath();c.moveTo(hx,hy);c.lineTo(ex,ey);c.stroke()}});
    c.globalCompositeOperation='source-over';
  };
}

/* III · desenhar a memória do rosto, à luz do Natal */
function p3(el,done){
  el.innerHTML=`<div class="rosto-folha" id="folha3"><canvas aria-label="Folha para desenhar a memória do teu rosto"></canvas><div class="rosto-veu" id="veu3"><p class="guia" id="g3a">Antes de desenhar, recorda.</p><button class="btn" id="recordar" type="button">Recordar o meu rosto</button></div></div>
    <p class="guia" id="g3" aria-live="polite"></p>
    <div class="acoes" id="ac3" hidden><button class="ligeiro" id="limpa3" type="button">Apagar e recomeçar</button><button class="btn" id="contempla3" type="button">Contemplar o meu rosto</button></div>`;
  const cv=$('canvas',el),veu=$('#veu3',el),g3=$('#g3',el);let F=null,tinta=0,feito=false;const T=[];
  onCleanup(()=>T.forEach(clearTimeout));
  const fundo=()=>{if(!F)return;const c=F.c;c.globalCompositeOperation='source-over';
    const g=c.createRadialGradient(F.w/2,0,0,F.w/2,0,F.h*1.2);g.addColorStop(0,'#2a1c10');g.addColorStop(.5,'#160e08');g.addColorStop(1,'#0c0805');c.fillStyle=g;c.fillRect(0,0,F.w,F.h)};
  let LC=null;
  requestAnimationFrame(()=>{F=fitCanvas(cv);fundo();const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;LC=o.getContext('2d');LC.setTransform(F.dpr,0,0,F.dpr,0,0)});
  $('#recordar',el).onclick=()=>{
    audio();const a=$('#g3a',el);$('#recordar',el).hidden=true;
    const fr=['Fecha os olhos por um momento.','Recorda o teu rosto: a testa, os olhos, a boca.','Lembra-te de um rosto teu que já foi novo.','Quando estiveres pronta(o), abre os olhos e desenha.'];
    fr.forEach((f,i)=>T.push(setTimeout(()=>{a.style.opacity=0;setTimeout(()=>{a.textContent=f;a.style.opacity=1},600);if(i===0)chime(392,.05,5)},i*5200)));
    T.push(setTimeout(()=>{veu.classList.add('fora');setTimeout(()=>veu.hidden=true,1200);$('#ac3',el).hidden=false;g3.textContent='Devagar. Cada linha é um gesto de ternura.'},fr.length*5200));
  };
  const frases=['Não procures a perfeição. Contempla.','Repara no que sentes ao recordar-te.','Este rosto já nasceu de novo muitas vezes.','Devagar. Cada linha é um gesto de ternura.'];
  let fi=0,ultima=0,prev=null,pt=0;
  const traço=(a,b,v)=>{const lw=Math.max(1.1,Math.min(4.2,4.4-v*.012));
    [F.c,LC].forEach(c=>{if(!c)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle='rgba(255,222,160,.92)';c.shadowColor='rgba(255,196,110,.7)';c.shadowBlur=9;c.lineWidth=lw;
    c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();c.restore()})};
  arrasta(cv,{
    down:p=>{if(!veu.hidden&&!veu.classList.contains('fora'))return;prev=p;pt=performance.now()},
    move:p=>{if(!prev||!F)return;const now=performance.now(),d=Math.hypot(p.x-prev.x,p.y-prev.y);if(d<1.5)return;
      const v=d/Math.max(1,now-pt)*1000;traço(prev,p,v);prev=p;pt=now;tinta+=d;
      if(now-ultima>12000&&tinta>200){ultima=now;g3.style.opacity=0;setTimeout(()=>{g3.textContent=frases[fi++%frases.length];g3.style.opacity=1},500)}},
    up:()=>prev=null
  });
  $('#limpa3',el).onclick=()=>{fundo();if(LC){LC.save();LC.setTransform(1,0,0,1,0,0);LC.clearRect(0,0,LC.canvas.width,LC.canvas.height);LC.restore()}tinta=0};
  $('#contempla3',el).onclick=()=>{
    if(tinta<60){g3.textContent='Desenha primeiro, mesmo que sejam poucas linhas.';return}
    let img=null;
    try{const o=document.createElement('canvas'),s=Math.min(1,420/cv.width);o.width=Math.round(cv.width*s);o.height=Math.round(cv.height*s);o.getContext('2d').drawImage(cv,0,0,o.width,o.height);const url=o.toDataURL('image/jpeg',.82);D.rosto=url;store.set('diario',D)}catch(e){}
    try{img=new Image();img.src=(LC?LC.canvas:cv).toDataURL('image/png')}catch(e){img=null}
    chime(392,.07,5);
    let stop=null,iv=null;
    const ov=overlay('caixa-escura',`<canvas></canvas><p class="sussurro" id="sus"></p>`,()=>{stop&&stop();clearInterval(iv)});
    const c2=$('canvas',ov.el),sus=$('#sus',ov.el);let G=null;requestAnimationFrame(()=>G=fitCanvas(c2));
    const fr=['Contempla o teu rosto.','Este rosto é amado.','Recorda os momentos em que nasceste de novo.','Permanece o tempo que sentires vontade.'];
    let k=0;const mostra=()=>{if(k<fr.length)troca(sus,fr[k++])};setTimeout(mostra,1500);iv=setInterval(mostra,9000);
    const luz=luzNatal();let a=0;
    stop=loop((t,dt)=>{if(!G)return;luz(G.c,G.w,G.h,t,dt);
      if(img&&img.complete){a=Math.min(1,a+dt*.25);const s=Math.min(G.w*.78/F.w,G.h*.52/F.h),iw=F.w*s,ih=F.h*s;const c=G.c;
        c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a*(.85+.1*Math.sin(t/2600));c.drawImage(img,(G.w-iw)/2,G.h*.56-ih/2,iw,ih);c.restore()}});
    if(!feito){feito=true;done()}
  };
}

/* IV · círculo branco: contemplar sem procurar nada */
function p4(el,done){
  el.innerHTML=`<div class="parede-pre"><span class="circ-pre"></span></div><div class="acoes"><button class="btn" id="senta">Sentar-me diante do círculo</button></div><p class="nota">Pousa as mãos. Não toques em nada. Deixa o olhar descansar no centro do círculo.</p>`;
  $('#senta',el).onclick=()=>{
    const evs=['pointermove','pointerdown','keydown','wheel','touchstart'];let iv=null;
    const mexe=()=>{last=performance.now()};
    const ov=overlay('parede',`<div class="circulo-branco" id="cb"></div><p class="sussurro" id="sus">Olha o círculo sem procurar nada.</p>`,()=>{clearInterval(iv);evs.forEach(e=>window.removeEventListener(e,mexe))});
    let last=performance.now(),estado=0,feito=false;
    const cb=$('#cb',ov.el),sus=$('#sus',ov.el);
    setTimeout(()=>sus.classList.add('vis'),1400);
    evs.forEach(e=>window.addEventListener(e,mexe,{passive:true}));
    iv=setInterval(()=>{
      const idle=(performance.now()-last)/1000;
      const op=Math.max(.03,1-Math.max(0,idle-5)/28);cb.style.opacity=op;
      const novo=op<.1?2:op<.55?1:0;
      if(novo>estado){estado=novo;troca(sus,novo===1?'Contemplar é saborear o momento presente.':'Observa sem julgamento e sem pressa. Aqui estou, por inteiro.');
        if(novo===2&&!feito){feito=true;chime(784,.04,5);done()}}
      else if(novo===0&&estado>0){estado=0;troca(sus,'Olha o círculo sem procurar nada.')}
    },250);
  };
}

function p6(el,done){
  el.innerHTML=`<div class="puzzle" id="pz" aria-label="Puzzle de nove peças"></div>
    <p class="guia" id="g6" aria-live="polite">Arrasta cada peça para o seu lugar. Sem pressa.</p>
    <form class="dizer" id="diz6" hidden><label class="lbl" for="eusou">Eu sou…</label><div class="linha-form"><input id="eusou" autocomplete="off" placeholder="inteira, amada, a caminho…"><button class="btn">Guardar</button></div><p class="nota" id="ok6"></p></form>`;
  const pz=$('#pz',el),g6=$('#g6',el),GR=3;
  const larg=Math.max(240,Math.min(360,pz.clientWidth||320)),B=Math.floor(larg/GR)*GR,P=B/GR;
  pz.style.width=B+'px';pz.style.height=Math.round(B*2.05)+'px';
  /* a forma escondida: a obra da artista, em 9 peças de 4 quadrados cada */
  const url=FOTO_PZ;
  const ordem=[...Array(GR*GR).keys()].sort(()=>Math.random()-.5);let certas=0,z=10;
  const PERG=['O que sentes nas mãos?','Que pensamentos surgem agora?','Repara na tua respiração.','Que emoção está presente?','Sem pressa. Cada peça a seu tempo.','O que te diz esta forma?'];
  for(let i=0;i<GR*GR;i++){const p=document.createElement('span');p.className='ranhura-pz';p.style.left=(i%GR)*P+'px';p.style.top=Math.floor(i/GR)*P+'px';p.style.width=p.style.height=P+'px';pz.appendChild(p)}
  ordem.forEach((id,k)=>{
    const col=id%GR,row=Math.floor(id/GR),px=col*P,py=row*P;
    const d=document.createElement('div');d.className='peca-pz';d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',`Peça ${k+1}`);
    d.style.width=d.style.height=P+'px';d.style.backgroundImage=`url(${url})`;d.style.backgroundSize=`${B}px ${B}px`;d.style.backgroundPosition=`-${px}px -${py}px`;
    const tx=(k%GR)*P+rnd(-6,6),ty=B+P*.25+Math.floor(k/GR)*P*.95+rnd(-4,4);
    let x=tx,y=ty;d.style.transform=`translate(${x}px,${y}px) rotate(${rnd(-7,7)}deg)`;
    const coloca=()=>{d.classList.add('certa');d.blur();d.style.transform=`translate(${px}px,${py}px)`;d.tabIndex=-1;toque();certas++;
      if(certas%2===0&&certas<GR*GR){g6.style.opacity=0;setTimeout(()=>{g6.textContent=PERG[(certas/2-1)%PERG.length];g6.style.opacity=1},400)}
      if(certas===GR*GR){pz.classList.add('completo');pz.style.height=B+'px';chime(523,.07,5);
        g6.textContent='Eu sou. Descobriste a forma. Fica um pouco com ela.';$('#diz6',el).hidden=false;done()}};
    let off=null;
    d.addEventListener('pointerdown',e=>{if(d.classList.contains('certa'))return;e.preventDefault();try{d.setPointerCapture(e.pointerId)}catch(_){}const r=pz.getBoundingClientRect();off={x:e.clientX-r.left-x,y:e.clientY-r.top-y};d.style.zIndex=++z;d.classList.add('agarrada')});
    d.addEventListener('pointermove',e=>{if(!off)return;const r=pz.getBoundingClientRect();x=e.clientX-r.left-off.x;y=e.clientY-r.top-off.y;d.style.transform=`translate(${x}px,${y}px)`});
    const solta=()=>{if(!off)return;off=null;d.classList.remove('agarrada');if(Math.hypot(x-px,y-py)<P*.32)coloca()};
    d.addEventListener('pointerup',solta);d.addEventListener('pointercancel',solta);
    d.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!d.classList.contains('certa')){e.preventDefault();coloca()}});
    pz.appendChild(d);
  });
  $('#diz6',el).onsubmit=e=>{e.preventDefault();const i=$('#eusou',el),v=i.value.trim();if(!v)return;guarda('eusou','Eu sou '+v.replace(/^eu sou\s*/i,''),true);i.value='';$('#ok6',el).textContent='Guardado na tua caixa de memórias.';chime(659,.05,3)};
}

/* VII · água: largar e lavar */
function p7(el,done){
  el.innerHTML=`<form class="dizer" id="larga" style="margin:0 0 20px"><label class="lbl" for="largar">O que queres largar?</label><div class="linha-form"><input id="largar" autocomplete="off" placeholder="a pressa, o rancor, o medo…"><button class="btn">Deixar na água</button></div></form>
    <div class="agua"><canvas aria-label="Água. Toca para a sentir."></canvas><div class="letras" id="letras"></div></div>
    <div class="lavar" id="lavar" hidden><p class="guia" id="lg">Agora passa as mãos da cabeça aos pés. Arrasta devagar, de cima para baixo.</p>
      <svg viewBox="0 0 120 280" class="figura" id="fig" role="img" aria-label="Figura humana. Arrasta de cima para baixo para passar a água.">
        <defs><clipPath id="corpoClip"><circle cx="60" cy="30" r="20"/><path d="${CORPO}"/></clipPath>
        <linearGradient id="gAgua" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8d8ea" stop-opacity=".95"/><stop offset="1" stop-color="#3f7ea6" stop-opacity=".9"/></linearGradient></defs>
        <rect x="0" y="0" width="120" height="280" fill="transparent"/>
        <g clip-path="url(#corpoClip)"><rect id="nivel" x="0" y="0" width="120" height="0" fill="url(#gAgua)"/></g>
        <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"><circle cx="60" cy="30" r="20"/><path d="${CORPO}"/></g>
      </svg></div>`;
  const cv=$('canvas',el);let F=null;const ondas=[];
  requestAnimationFrame(()=>F=fitCanvas(cv));
  loop((t,dt)=>{
    if(!F)return;const {c,w,h}=F;
    const g=c.createRadialGradient(w/2,h*.45,0,w/2,h/2,w*.6);g.addColorStop(0,'#2a5576');g.addColorStop(1,'#0b1824');c.fillStyle=g;c.fillRect(0,0,w,h);
    c.save();c.globalAlpha=.08;c.strokeStyle='#d8eef9';c.lineWidth=1;
    for(let i=0;i<10;i++){c.beginPath();for(let x=0;x<=w;x+=12){const y=h*(i+.5)/10+Math.sin(x*.02+t/1500+i)*5+Math.sin(x*.05-t/950)*2;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
    c.restore();
    if(Math.random()<.005)ondas.push({x:rnd(0,w),y:rnd(0,h),r:0,a:.22});
    for(let i=ondas.length-1;i>=0;i--){const o=ondas[i];o.r+=42*dt;o.a-=.1*dt;if(o.a<=0){ondas.splice(i,1);continue}
      c.strokeStyle=`rgba(225,240,250,${o.a})`;c.lineWidth=1.4;c.beginPath();c.ellipse(o.x,o.y,o.r,o.r*.5,0,0,7);c.stroke();
      c.strokeStyle=`rgba(225,240,250,${o.a*.5})`;c.beginPath();c.ellipse(o.x,o.y,o.r*.62,o.r*.31,0,0,7);c.stroke()}
  });
  const pinga=(x,y)=>{ondas.push({x,y,r:0,a:.75});gota()};
  arrasta(cv,{down:p=>pinga(p.x,p.y)});
  const T=[];onCleanup(()=>T.forEach(clearTimeout));
  $('#larga',el).onsubmit=e=>{
    e.preventDefault();const i=$('#largar',el),v=i.value.trim();if(!v)return;guarda('largar',v,true);i.value='';i.blur();
    const L=$('#letras',el);L.innerHTML='';
    [...v].forEach((ch,k)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;s.style.animationDelay=(.8+k*.09)+'s';L.appendChild(s)});
    if(F){pinga(F.w/2,F.h*.5);T.push(setTimeout(()=>F&&pinga(F.w/2+24,F.h*.52),800))}
    T.push(setTimeout(()=>{$('#lavar',el).hidden=false},2600));
  };
  const fig=$('#fig',el),nivel=$('#nivel',el),lg=$('#lg',el);let max=0,fe=false;
  const molha=p=>{
    if(fe)return;const r=fig.getBoundingClientRect(),y=p.y/r.height*280;
    if(max===0&&y>60){lg.textContent='Começa pela cabeça.';return}
    if(y>max+50)return;
    if(y>max){max=Math.min(280,y);nivel.setAttribute('height',max);if(Math.random()<.12)gota()}
    if(max>=264){fe=true;nivel.setAttribute('height',280);lg.textContent='Lavado da cabeça aos pés. Deixa-te ficar.';chime(698,.07,4);done()}
  };
  arrasta(fig,{down:molha,move:molha});
}

    const g=b.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);g.addColorStop(0,'#9a958e');g.addColorStop(1,'#7c7771');b.fillStyle=g;b.fillRect(0,0,W,H);
    for(let i=0;i<9000;i++){const v=Math.random();b.fillStyle=v<.4?'rgba(40,38,36,.35)':v<.8?'rgba(210,206,200,.35)':'rgba(15,14,13,.6)';const s=Math.random()*1.8*F.dpr;b.fillRect(Math.random()*W,Math.random()*H,s,s)}
    pintaBase(F,base);
  });
  const empurra=p=>{if(!F)return;const c=F.c;c.save();c.globalCompositeOperation='destination-out';const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,16);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,16,0,7);c.fill();c.restore();
    c.save();c.fillStyle='rgba(165,160,152,.5)';for(let i=0;i<3;i++){const a=Math.random()*7,r=16+Math.random()*5;c.fillRect(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,1.4,1.4)}c.restore()};
  const formaMao=(c,u)=>{c.beginPath();c.ellipse(0,.32*u,.46*u,.52*u,0,0,7);
    [[-.33,-.12,.18,.78],[-.11,-.2,.19,.92],[.11,-.18,.19,.88],[.32,-.08,.17,.66]].forEach(([x,y,wd,len])=>{c.save();c.translate(x*u,y*u);c.rotate(x*.35);c.roundRect?c.roundRect(-wd*u/2,-len*u*.85,wd*u,len*u,wd*u/2):c.rect(-wd*u/2,-len*u*.85,wd*u,len*u);c.restore()});
    c.save();c.translate(-.46*u,.36*u);c.rotate(-1);c.roundRect?c.roundRect(-.1*u,-.62*u,.2*u,.66*u,.1*u):c.rect(-.1*u,-.62*u,.2*u,.66*u);c.restore()};
  const mao=p=>{if(!F)return;const c=F.c,u=Math.min(F.w,F.h)*.26,rot=rnd(-.25,.25);
    c.save();c.translate(p.x,p.y);c.rotate(rot);c.globalCompositeOperation='destination-out';
    c.fillStyle='rgba(0,0,0,.28)';c.save();c.scale(1.07,1.05);formaMao(c,u);c.fill();c.restore();
    c.fillStyle='rgba(0,0,0,.42)';formaMao(c,u);c.fill();c.restore();
    c.save();c.fillStyle='rgba(175,170,162,.55)';for(let i=0;i<70;i++){const a=Math.random()*7,r=u*(.75+Math.random()*.25);c.fillRect(p.x+Math.cos(a)*r*.75,p.y+Math.sin(a)*r,1.5,1.5)}c.restore();
    maos++;chime(196,.05,6);g12.style.opacity=0;setTimeout(()=>{g12.textContent=maos===1?'Nasci do pó e ao pó voltarei. Meditar sobre a morte ajuda a viver melhor.':'A tua marca fica, por um tempo. Como tudo.';g12.style.opacity=1},500);fim()};
  let prev=null,ini=null,moveu=0;
  arrasta(cv,{down:p=>{prev=p;ini=p;moveu=0},move:p=>{if(!prev)return;const d=Math.hypot(p.x-prev.x,p.y-prev.y);moveu+=d;if(moveu<8)return;const st=Math.max(1,Math.ceil(d/5));for(let i=1;i<=st;i++)empurra({x:prev.x+(p.x-prev.x)*i/st,y:prev.y+(p.y-prev.y)*i/st});prev=p},
    up:()=>{if(ini&&moveu<8)mao(ini);else if(moveu>=8)fim();prev=null;ini=null}});
  $('#f12',el).onsubmit=async e=>{
    e.preventDefault();const i=$('#nome',el),v=i.value.trim();if(!v||!F)return;guarda('nomes',v,true);i.value='';
    try{await document.fonts.load('34px Marcellus')}catch(_){}
    const c=F.c,sz=Math.min(40,F.w/10);c.save();c.globalCompositeOperation='destination-out';c.font=`${sz}px Marcellus, Georgia, serif`;c.textAlign='center';c.fillStyle='rgba(0,0,0,.78)';
    const y=F.h*(.22+.28*(nomes%3));c.fillText(v,F.w/2+rnd(-20,20),y);c.restore();nomes++;chime(220,.06,6);fim();
  };
  $('#alisa',el).onclick=()=>{if(!F)return;let n=0;const iv=setInterval(()=>{pintaBase(F,base,.12);if(++n>24)clearInterval(iv)},40);onCleanup(()=>clearInterval(iv))};
}

/* XIII · o grão de trigo na terra, com uma intenção profunda */
function p13(el,done){
  el.innerHTML=`<blockquote class="citacao">«Se o grão de trigo não morrer na terra, é impossível que nasça fruto.»</blockquote>
    <form class="dizer" id="f13" style="margin-top:0"><label class="lbl" for="transf">A intenção profunda que semeias</label><div class="linha-form"><input id="transf" autocomplete="off" placeholder="Pensa nela, ou escreve-a aqui"><button class="btn">Guardar no coração</button></div></form>
    <div class="campo" id="campo"><div class="trigo-taca" id="tt" aria-label="Recipiente com trigo"></div><div class="terra" id="terra" aria-label="Caixa de terra"></div></div>
    <p class="guia" id="g13" aria-live="polite">Com a tua intenção no coração, escolhe um grão de trigo.</p>`;
  const tt=$('#tt',el),campo=$('#campo',el),terra=$('#terra',el),g13=$('#g13',el);let usado=false;
  $('#f13',el).onsubmit=e=>{e.preventDefault();const i=$('#transf',el);if(!i.value.trim())return;guarda('transformar',i.value);i.value='';g13.textContent='Guardada no coração. Agora escolhe um grão de trigo.';chime(494,.05,3)};
  const graos=[];
  for(let i=0;i<34;i++){const a=rnd(0,7),r=Math.sqrt(Math.random())*34;const b=document.createElement('button');b.type='button';b.className='grao';b.setAttribute('aria-label','Grão de trigo');b.style.left=(50+Math.cos(a)*r-3.5)+'%';b.style.top=(50+Math.sin(a)*r-2)+'%';b.style.transform=`rotate(${rnd(0,180)}deg)`;tt.appendChild(b);graos.push(b)}
  const T=[];onCleanup(()=>T.forEach(clearTimeout));
  function troca2(t){g13.style.opacity=0;setTimeout(()=>{g13.textContent=t;g13.style.opacity=1},700)}
  graos.forEach(b=>b.onclick=()=>{
    if(usado){g13.textContent='Basta um grão.';return}
    usado=true;graos.forEach(x=>x.disabled=true);
    const rc=campo.getBoundingClientRect(),rb=b.getBoundingClientRect(),rt=terra.getBoundingClientRect();
    const f=b.cloneNode();f.className='grao voa';f.disabled=true;f.style.left=(rb.left-rc.left)+'px';f.style.top=(rb.top-rc.top)+'px';campo.appendChild(f);b.style.visibility='hidden';
    const tx=rt.left-rc.left+rt.width*rnd(.35,.65),ty=rt.top-rc.top+rt.height*rnd(.45,.6);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.left=tx+'px';f.style.top=ty+'px';f.style.transform='rotate(400deg)'}));
    troca2('Coloca-o na terra com a tua intenção.');
    const lx=((tx-(rt.left-rc.left)+6)/rt.width*100)+'%',ly=((ty-(rt.top-rc.top)+4)/rt.height*100)+'%';
    T.push(setTimeout(()=>{toque();const m=document.createElement('span');m.className='monticulo';m.style.left=lx;m.style.top=ly;terra.appendChild(m);requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('on')));f.style.opacity=0},1700));
    T.push(setTimeout(()=>troca2('O grão entrega-se à terra. Agradece.'),3400));
    T.push(setTimeout(()=>{chime(330,.07,6);done()},6000));
    T.push(setTimeout(()=>{const s=document.createElement('span');s.className='broto';s.style.left=lx;s.style.top=ly;terra.appendChild(s);requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')));troca2('O que é semeado com amor dá fruto.');chime(659,.04,5)},16000));
  });
}

/* XIV · água sobre a lousa */
function p14(el,done){
  el.innerHTML=`<div class="lousa"><canvas aria-label="Pedra de lousa. Desenha com água."></canvas></div>
    <p class="guia suave" id="g14">Molha o pincel e desenha. As linhas evaporam-se.</p>`;
  const cv=$('canvas',el);let F=null,base=null;const seg=[];let tinta=1,prev=null,total=0,feito=false;
  requestAnimationFrame(()=>{
    F=fitCanvas(cv);base=offscreen(F);const b=base.getContext('2d'),W=base.width,H=base.height;
    const g=b.createLinearGradient(0,0,W,H);g.addColorStop(0,'#3a4046');g.addColorStop(1,'#2a2f34');b.fillStyle=g;b.fillRect(0,0,W,H);
    b.strokeStyle='rgba(255,255,255,.025)';for(let i=0;i<60;i++){b.lineWidth=rnd(.5,2)*F.dpr;b.beginPath();const y=rnd(0,H);b.moveTo(0,y);b.bezierCurveTo(W*.3,y+rnd(-20,20),W*.7,y+rnd(-20,20),W,y+rnd(-10,10));b.stroke()}
    for(let i=0;i<4000;i++){b.fillStyle=Math.random()<.5?'rgba(0,0,0,.15)':'rgba(255,255,255,.04)';b.fillRect(Math.random()*W,Math.random()*H,F.dpr,F.dpr)}
  });
  arrasta(cv,{
    down:p=>{prev=p;tinta=1;gota()},
    move:p=>{if(!prev)return;const d=Math.hypot(p.x-prev.x,p.y-prev.y);if(d<2)return;seg.push({a:prev,b:p,t:performance.now(),w:20*tinta+4});tinta=Math.max(.15,tinta-d/900);total+=d;prev=p;
      if(total>260&&!feito){feito=true;done();$('#g14',el).textContent='Aquilo que vamos largando dá lugar ao novo.'}},
    up:()=>prev=null
  });
  loop(t=>{
    if(!F||!base)return;pintaBase(F,base);const c=F.c;c.lineCap='round';
    for(let i=seg.length-1;i>=0;i--){const s=seg[i],age=(t-s.t)/1000,life=7+s.w*.12;if(age>life){seg.splice(i,1);continue}
      const k=1-age/life,w=s.w*(.35+.65*k);
      c.strokeStyle=`rgba(14,17,20,${.6*k})`;c.lineWidth=w;c.beginPath();c.moveTo(s.a.x,s.a.y);c.lineTo(s.b.x,s.b.y);c.stroke();
      c.strokeStyle=`rgba(190,205,215,${.1*k})`;c.lineWidth=w*.25;c.beginPath();c.moveTo(s.a.x-w*.15,s.a.y-w*.15);c.lineTo(s.b.x-w*.15,s.b.y-w*.15);c.stroke()}
  });
}

render();
})();
